<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 고양이 몸 -->
  <ellipse cx="100" cy="130" rx="45" ry="35" fill="#ff9500" stroke="#000" stroke-width="2"/>

  <!-- 고양이 머리 -->
  <circle cx="100" cy="80" r="35" fill="#ff9500" stroke="#000" stroke-width="2"/>

  <!-- 고양이 귀 -->
  <polygon points="75,50 85,30 95,50" fill="#ff9500" stroke="#000" stroke-width="2"/>
  <polygon points="105,50 115,30 125,50" fill="#ff9500" stroke="#000" stroke-width="2"/>

  <!-- 귀 안쪽 -->
  <polygon points="78,48 82,35 88,48" fill="#ffb347"/>
  <polygon points="112,48 118,35 122,48" fill="#ffb347"/>

  <!-- 고양이 눈 -->
  <ellipse cx="90" cy="75" rx="6" ry="8" fill="#000"/>
  <ellipse cx="110" cy="75" rx="6" ry="8" fill="#000"/>

  <!-- 눈 하이라이트 -->
  <ellipse cx="92" cy="72" rx="2" ry="3" fill="#fff"/>
  <ellipse cx="112" cy="72" rx="2" ry="3" fill="#fff"/>

  <!-- 고양이 코 -->
  <polygon points="100,85 95,90 105,90" fill="#ff69b4"/>

  <!-- 고양이 입 -->
  <path d="M 100 92 Q 95 95 90 92" stroke="#000" stroke-width="2" fill="none"/>
  <path d="M 100 92 Q 105 95 110 92" stroke="#000" stroke-width="2" fill="none"/>

  <!-- 고양이 수염 -->
  <line x1="60" y1="85" x2="80" y2="80" stroke="#000" stroke-width="2"/>
  <line x1="60" y1="95" x2="80" y2="95" stroke="#000" stroke-width="2"/>
  <line x1="120" y1="80" x2="140" y2="85" stroke="#000" stroke-width="2"/>
  <line x1="120" y1="95" x2="140" y2="95" stroke="#000" stroke-width="2"/>

  <!-- 고양이 다리 -->
  <ellipse cx="75" cy="155" rx="8" ry="15" fill="#ff9500" stroke="#000" stroke-width="2"/>
  <ellipse cx="95" cy="155" rx="8" ry="15" fill="#ff9500" stroke="#000" stroke-width="2"/>
  <ellipse cx="105" cy="155" rx="8" ry="15" fill="#ff9500" stroke="#000" stroke-width="2"/>
  <ellipse cx="125" cy="155" rx="8" ry="15" fill="#ff9500" stroke="#000" stroke-width="2"/>

  <!-- 고양이 발가락 -->
  <circle cx="75" cy="168" r="4" fill="#ff7700"/>
  <circle cx="95" cy="168" r="4" fill="#ff7700"/>
  <circle cx="105" cy="168" r="4" fill="#ff7700"/>
  <circle cx="125" cy="168" r="4" fill="#ff7700"/>

  <!-- 고양이 꼬리 -->
  <path d="M 55 120 Q 30 100 25 70" stroke="#ff9500" stroke-width="15" fill="none" stroke-linecap="round"/>
  <path d="M 55 120 Q 30 100 25 70" stroke="#000" stroke-width="2" fill="none"/>

  <!-- 배 무늬 -->
  <ellipse cx="100" cy="130" rx="25" ry="20" fill="#ffb347"/>
</svg>